<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆 / 双摆物理模拟器 · Week05</title>
<style>
  :root {
    --bg: #1a1a24;
    --panel: rgba(30, 30, 44, .78);
    --line: rgba(255, 255, 255, .09);
    --txt: #e0e6ed;
    --dim: #7a869a;
    --cyan: #00e5ff;
    --blue: #90caf9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px 16px 28px;
  }
  .head { text-align: center; }
  h1 { font-size: 1.18rem; font-weight: 600; color: #f0f4f8; letter-spacing: .4px; }
  .sub { font-size: .72rem; color: var(--dim); margin-top: 3px; letter-spacing: .3px; }

  canvas {
    display: block;
    width: 900px;
    max-width: 100%;
    border-radius: 14px;
    background: radial-gradient(circle at 50% 12%, #242436 0%, #13131b 72%);
    box-shadow: 0 12px 44px rgba(0, 0, 0, .7), inset 0 0 0 1px rgba(255, 255, 255, .04);
    cursor: grab;
    touch-action: none;
  }
  canvas.dragging { cursor: grabbing; }

  .panel {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: 18px 22px;
    padding: 13px 24px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 6px 26px rgba(0, 0, 0, .4);
    width: 900px;
    max-width: 100%;
  }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .label-row {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: .73rem; color: var(--blue); font-weight: 500;
  }
  .value { color: #fff; font-family: ui-monospace, Consolas, monospace; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 158px; height: 6px; border-radius: 3px;
    background: #33334d; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--cyan); cursor: pointer; box-shadow: 0 0 10px rgba(0, 229, 255, .75);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border: none; border-radius: 50%;
    background: var(--cyan); cursor: pointer;
  }

  .divider { width: 1px; align-self: stretch; background: var(--line); }

  /* 模式切换 */
  .tabs { display: flex; gap: 4px; padding: 3px; background: rgba(0, 0, 0, .3); border-radius: 9px; }
  .tab {
    border: none; background: transparent; color: var(--dim);
    font-size: .76rem; font-weight: 600; padding: 6px 14px; border-radius: 7px;
    cursor: pointer; transition: all .18s ease;
  }
  .tab:hover { color: #cfd8dc; }
  .tab.active { background: rgba(0, 229, 255, .14); color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(0, 229, 255, .3); }

  /* 天体胶囊 */
  .capsules { display: flex; gap: 6px; }
  .cap {
    border: 1px solid var(--line); background: rgba(255, 255, 255, .03);
    color: #b0bec5; font-size: .73rem; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; transition: all .18s ease; white-space: nowrap;
  }
  .cap:hover { border-color: rgba(0, 229, 255, .4); color: #e0f7fa; transform: translateY(-1px); }
  .cap.active {
    background: linear-gradient(135deg, rgba(0, 229, 255, .22), rgba(124, 77, 255, .22));
    border-color: rgba(0, 229, 255, .55); color: #e0f7fa;
  }

  .btn {
    border: none; padding: 9px 18px; font-size: .8rem; font-weight: 600;
    border-radius: 9px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%);
    box-shadow: 0 3px 12px rgba(229, 57, 53, .32);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(229, 57, 53, .45); }
  .btn:active { transform: translateY(0); }

  .hint { font-size: .7rem; color: var(--dim); }
  @media (max-width: 940px) {
    .panel { gap: 12px; }
    input[type="range"] { width: 120px; }
  }
</style>
</head>
<body>
  <div class="head">
    <h1>单摆 / 双摆物理模拟器</h1>
    <div class="sub">Week05 · 意图造物与 ReAct 闭环编程 · 可直接拖拽摆球</div>
  </div>

  <canvas id="stage"></canvas>

  <div class="panel">
    <div class="group">
      <div class="label-row"><span>模式 Mode</span></div>
      <div class="tabs">
        <button class="tab active" id="tabSingle" type="button" data-mode="single">单摆</button>
        <button class="tab" id="tabDouble" type="button" data-mode="double">双摆</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="group">
      <div class="label-row"><span>摆长 Length</span><span class="value" id="lenVal">200 px</span></div>
      <input type="range" id="lenSlider" min="100" max="350" step="1" value="200">
    </div>

    <div class="group">
      <div class="label-row"><span>重力 Gravity</span><span class="value" id="gravVal">9.8</span></div>
      <input type="range" id="gravSlider" min="1" max="25" step="0.1" value="9.8">
    </div>

    <div class="group">
      <div class="label-row"><span>空气阻尼 Damping</span><span class="value" id="dampVal">0.0020</span></div>
      <input type="range" id="dampSlider" min="0" max="0.01" step="0.0005" value="0.002">
    </div>

    <button class="btn" id="resetBtn" type="button">重置摆动</button>

    <div class="divider"></div>

    <div class="group">
      <div class="label-row"><span>天体场景 Preset</span></div>
      <div class="capsules">
        <button class="cap active" type="button" data-g="9.8">🌍 地球</button>
        <button class="cap" type="button" data-g="1.62">🌙 月球</button>
        <button class="cap" type="button" data-g="24.79">🪐 木星</button>
        <button class="cap" type="button" data-g="0.5">🛰 太空</button>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">拖动滑块实时改变物理参数 · 鼠标按住摆球可拖拽改变初始角度 · 参数自动保存在本地</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   *  0. 画布与坐标系统（按设备像素比放大，保证高清屏不模糊）
   * ============================================================ */
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  const W = 900, H = 520;                 // 逻辑尺寸
  const PIVOT = { x: W / 2, y: 80 };      // 悬点
  const PX_PER_M = 100;                   // 100px = 1m（物理单位换算）
  const DAMP_SCALE = 200;                 // 阻尼放大到肉眼可感的衰减
  const START = { single: { t1: 45, t2: 0 }, double: { t1: 45, t2: 90 } };
  const STORAGE_KEY = 'week05.pendulum.state.v1';

  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.height = (H * canvas.getBoundingClientRect().width / W || H) + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* ============================================================
   *  1. 状态
   * ============================================================ */
  const state = {
    mode: 'single',
    lengthPx: 200,      // 摆长（像素）
    gravity: 9.8,       // 当前重力（平滑过渡后的实际值）
    gravityTarget: 9.8, // 目标重力（滑块 / 预设写入）
    damping: 0.002,
    t1: 0, w1: 0,       // 第一段摆角 / 角速度
    t2: 0, w2: 0,       // 第二段（双摆用）
    trail: [],
    drag: null
  };

  const deg = (d) => d * Math.PI / 180;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function resetState() {
    const s = START[state.mode];
    state.t1 = deg(s.t1);
    state.t2 = deg(s.t2);
    state.w1 = 0;
    state.w2 = 0;
    state.trail.length = 0;
    last = performance.now();
  }

  /* ============================================================
   *  2. 物理：单摆解析方程 + 双摆 RK4 数值积分
   * ============================================================ */

  // 单摆：α = -(g/L)·sinθ - c·ω
  function accelSingle(t, w) {
    const L = state.lengthPx / PX_PER_M;
    const c = state.damping * DAMP_SCALE;
    return -(state.gravity / L) * Math.sin(t) - c * w;
  }

  // 双摆：拉格朗日方程（m1 = m2 = 1，l1 = L，l2 = 0.75L）
  function accelDouble(s) {
    const [t1, w1, t2, w2] = s;
    const l1 = state.lengthPx / PX_PER_M;
    const l2 = l1 * 0.75;
    const g = state.gravity;
    const c = state.damping * DAMP_SCALE;
    const d = t1 - t2;
    const den = 3 - Math.cos(2 * d);          // 2*m1+m2 - m2*cos(2Δ)，m1=m2=1

    const a1 = (-g * 3 * Math.sin(t1)
                - g * Math.sin(t1 - 2 * t2)
                - 2 * Math.sin(d) * (w2 * w2 * l2 + w1 * w1 * l1 * Math.cos(d)))
               / (l1 * den);

    const a2 = (2 * Math.sin(d) * (w1 * w1 * l1 * 2 + g * 2 * Math.cos(t1)
                + w2 * w2 * l2 * Math.cos(d)))
               / (l2 * den);

    return [a1 - c * w1, a2 - c * w2];
  }

  // 四阶 Runge-Kutta：state = [θ1, ω1, θ2, ω2]
  function rk4(s, h) {
    const k1 = deriv(s);
    const k2 = deriv(add(s, k1, h / 2));
    const k3 = deriv(add(s, k2, h / 2));
    const k4 = deriv(add(s, k3, h));
    return s.map((v, i) => v + (h / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
  }
  const add = (s, d, h) => s.map((v, i) => v + d[i] * h);
  function deriv(s) {
    const [a1, a2] = accelDouble(s);
    return [s[1], a1, s[3], a2];
  }

  function integrate(dt) {
    if (state.mode === 'single') {
      // 单摆用速度 Verlet 风格的分步积分，稳定且能量守恒好
      const steps = 4, h = dt / steps;
      for (let i = 0; i < steps; i++) {
        state.w1 += accelSingle(state.t1, state.w1) * h;
        state.t1 += state.w1 * h;
      }
    } else {
      const steps = 8, h = dt / steps;       // 双摆混沌，细分提高数值稳定性
      let s = [state.t1, state.w1, state.t2, state.w2];
      for (let i = 0; i < steps; i++) s = rk4(s, h);
      [state.t1, state.w1, state.t2, state.w2] = s;
    }
  }

  /* ============================================================
   *  3. 几何：像素长度、缩放（保证长摆在画布内不出界）
   * ============================================================ */
  function geometry() {
    const L1 = state.lengthPx;
    const L2 = L1 * 0.75;
    const reach = state.mode === 'double' ? L1 + L2 : L1;
    const available = H - PIVOT.y - 46;
    const k = Math.min(1, available / reach);
    return { L1: L1 * k, L2: L2 * k, k };
  }

  function bobs() {
    const g = geometry();
    const p1 = { x: PIVOT.x + g.L1 * Math.sin(state.t1), y: PIVOT.y + g.L1 * Math.cos(state.t1) };
    if (state.mode === 'single') return [p1];
    const p2 = { x: p1.x + g.L2 * Math.sin(state.t2), y: p1.y + g.L2 * Math.cos(state.t2) };
    return [p1, p2];
  }

  /* ============================================================
   *  4. 渲染
   * ============================================================ */
  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.028)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 45) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 45) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawTrail() {
    const t = state.trail;
    if (t.length < 2) return;
    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 1; i < t.length; i++) {
      const p = i / t.length;                     // 0 = 最旧, 1 = 最新
      const hue = 190 + 120 * p;                  // 青 -> 紫 -> 洋红
      ctx.beginPath();
      ctx.moveTo(t[i - 1].x, t[i - 1].y);
      ctx.lineTo(t[i].x, t[i].y);
      ctx.strokeStyle = 'hsla(' + hue.toFixed(0) + ',100%,' + (55 + 15 * p).toFixed(0) + '%,' + (0.55 * p).toFixed(3) + ')';
      ctx.lineWidth = 1 + 5 * p;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRod(x1, y1, x2, y2, alpha) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawBob(p, color, r, glow) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(p.x - r * 0.28, p.y - r * 0.28, r * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fill();
  }

  function drawHud() {
    const L = state.lengthPx / PX_PER_M;
    const period = 2 * Math.PI * Math.sqrt(L / Math.max(state.gravity, 0.001));
    const lines = [
      'MODE   ' + (state.mode === 'single' ? '单摆' : '双摆混沌'),
      'θ1     ' + (state.t1 * 180 / Math.PI).toFixed(1) + '°',
      'L      ' + state.lengthPx.toFixed(0) + ' px',
      'g      ' + state.gravity.toFixed(2) + ' m/s²',
      'T      ' + (state.mode === 'single' ? period.toFixed(2) + ' s' : '混沌（无固定周期）')
    ];
    ctx.save();
    ctx.font = '12px ui-monospace, Consolas, monospace';
    ctx.textBaseline = 'top';
    lines.forEach((line, i) => {
      ctx.fillStyle = 'rgba(144,202,249,.55)';
      ctx.fillText(line, 20, 18 + i * 17);
    });
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawGrid();

    // 平衡参考线
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([4, 9]);
    ctx.moveTo(PIVOT.x, PIVOT.y);
    ctx.lineTo(PIVOT.x, H - 12);
    ctx.strokeStyle = 'rgba(255,255,255,.07)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    if (state.mode === 'double') drawTrail();

    const pts = bobs();

    // 悬点
    ctx.save();
    ctx.beginPath();
    ctx.arc(PIVOT.x, PIVOT.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#90caf9';
    ctx.shadowColor = '#42a5f5';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.restore();

    if (state.mode === 'single') {
      const p = pts[0];
      drawRod(PIVOT.x, PIVOT.y, p.x, p.y, 0.45);
      drawBob(p, '#00e5ff', 18, 26);
    } else {
      const [p1, p2] = pts;
      drawRod(PIVOT.x, PIVOT.y, p1.x, p1.y, 0.45);
      drawRod(p1.x, p1.y, p2.x, p2.y, 0.3);
      drawBob(p1, '#7c4dff', 14, 20);
      drawBob(p2, '#ff4081', 16, 24);
    }

    drawHud();
  }

  /* ============================================================
   *  5. 主循环
   * ============================================================ */
  let last = performance.now();

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // 重力平滑过渡（天体切换不生硬）
    if (Math.abs(state.gravity - state.gravityTarget) > 1e-4) {
      state.gravity += (state.gravityTarget - state.gravity) * Math.min(1, dt * 7);
    } else {
      state.gravity = state.gravityTarget;
    }

    if (state.drag === null) integrate(dt);

    // 记录双摆末端轨迹
    if (state.mode === 'double') {
      const p = bobs()[1];
      state.trail.push({ x: p.x, y: p.y });
      if (state.trail.length > 80) state.trail.shift();
    } else if (state.trail.length) {
      state.trail.length = 0;
    }

    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
   *  6. 交互：滑块 / 重置 / 模式 / 天体 / 拖拽
   * ============================================================ */
  const lenSlider = document.getElementById('lenSlider');
  const gravSlider = document.getElementById('gravSlider');
  const dampSlider = document.getElementById('dampSlider');
  const lenVal = document.getElementById('lenVal');
  const gravVal = document.getElementById('gravVal');
  const dampVal = document.getElementById('dampVal');
  const capButtons = Array.from(document.querySelectorAll('.cap'));
  const tabButtons = Array.from(document.querySelectorAll('.tab'));

  function syncLabels() {
    lenVal.textContent = state.lengthPx.toFixed(0) + ' px';
    gravVal.textContent = state.gravityTarget.toFixed(2);
    dampVal.textContent = state.damping.toFixed(4);
  }

  function markPreset(g) {
    capButtons.forEach((b) => {
      b.classList.toggle('active', Math.abs(parseFloat(b.dataset.g) - g) < 0.01);
    });
  }

  lenSlider.addEventListener('input', function (e) {
    state.lengthPx = clamp(parseFloat(e.target.value), 100, 350);
    state.trail.length = 0;
    syncLabels();
    saveSoon();
  });

  gravSlider.addEventListener('input', function (e) {
    state.gravityTarget = clamp(parseFloat(e.target.value), 1, 25);
    markPreset(state.gravityTarget);
    syncLabels();
    saveSoon();
  });

  dampSlider.addEventListener('input', function (e) {
    state.damping = clamp(parseFloat(e.target.value), 0, 0.01);
    syncLabels();
    saveSoon();
  });

  capButtons.forEach((btn) => {
    btn.addEventListener('click', function () {
      const g = parseFloat(btn.dataset.g);
      state.gravityTarget = g;
      gravSlider.value = String(g);
      markPreset(g);
      syncLabels();
      saveSoon();
    });
  });

  tabButtons.forEach((btn) => {
    btn.addEventListener('click', function () {
      if (state.mode === btn.dataset.mode) return;
      state.mode = btn.dataset.mode;
      tabButtons.forEach((b) => b.classList.toggle('active', b === btn));
      resetState();
      syncLabels();
      saveSoon();
    });
  });

  // 重置：摆球回到当前模式的初始角度并静止
  function resetSimulation() {
    resetState();
  }
  document.getElementById('resetBtn').addEventListener('click', resetSimulation);

  // ---------- 拖拽摆球 ----------
  function toLogical(evt) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (evt.clientX - rect.left) * (W / rect.width),
      y: (evt.clientY - rect.top) * (W / rect.height)
    };
  }

  function nearestBob(p) {
    const pts = bobs();
    let best = -1, bestD = 34;
    pts.forEach((b, i) => {
      const d = Math.hypot(b.x - p.x, b.y - p.y);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  }

  canvas.addEventListener('pointerdown', function (evt) {
    const p = toLogical(evt);
    const idx = nearestBob(p);
    if (idx < 0) return;
    state.drag = idx;
    canvas.classList.add('dragging');
    canvas.setPointerCapture(evt.pointerId);
    evt.preventDefault();
  });

  canvas.addEventListener('pointermove', function (evt) {
    if (state.drag === null) return;
    const p = toLogical(evt);
    const g = geometry();

    if (state.mode === 'single' || state.drag === 0) {
      state.t1 = Math.atan2(p.x - PIVOT.x, p.y - PIVOT.y);
      state.w1 = 0;
      if (state.mode === 'double') state.w2 = 0;
    } else {
      // 拖第二段：以第一段末端为支点反解相对角
      const p1 = bobs()[0];
      state.t2 = Math.atan2(p.x - p1.x, p.y - p1.y);
      state.w2 = 0;
    }
    state.trail.length = 0;
  });

  function endDrag() {
    if (state.drag === null) return;
    state.drag = null;
    canvas.classList.remove('dragging');
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  /* ============================================================
   *  7. 本地持久化（localStorage）
   * ============================================================ */
  const DEFAULT_STATE = { lengthPx: 200, gravity: 9.8, damping: 0.002, mode: 'single' };
  let saveTimer = null;

  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 150);
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        lengthPx: state.lengthPx,
        gravity: state.gravityTarget,
        damping: state.damping,
        mode: state.mode
      }));
    } catch (err) {
      /* 隐私模式下 localStorage 不可用，静默降级，不影响主功能 */
    }
  }

  function load() {
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    } catch (err) {
      saved = null;
    }
    const s = Object.assign({}, DEFAULT_STATE, saved && typeof saved === 'object' ? saved : {});

    state.lengthPx = clamp(Number(s.lengthPx) || DEFAULT_STATE.lengthPx, 100, 350);
    state.gravityTarget = clamp(Number(s.gravity) || DEFAULT_STATE.gravity, 1, 25);
    state.gravity = state.gravityTarget;
    state.damping = clamp(Number.isFinite(Number(s.damping)) ? Number(s.damping) : DEFAULT_STATE.damping, 0, 0.01);
    state.mode = s.mode === 'double' ? 'double' : 'single';

    lenSlider.value = String(state.lengthPx);
    gravSlider.value = String(state.gravityTarget);
    dampSlider.value = String(state.damping);
    tabButtons.forEach((b) => b.classList.toggle('active', b.dataset.mode === state.mode));
    markPreset(state.gravityTarget);
    syncLabels();
  }

  /* ============================================================
   *  8. 启动
   * ============================================================ */
  fitCanvas();
  load();
  resetState();
  window.addEventListener('resize', function () {
    const h = H * (canvas.getBoundingClientRect().width / W);
    canvas.style.height = h + 'px';
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
