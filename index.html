<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆物理模拟器 · Week05</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a24;
    color: #e0e6ed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
  }
  h1 { font-size: 1.25rem; font-weight: 600; color: #f0f4f8; letter-spacing: .5px; }
  .sub { font-size: .78rem; color: #7a869a; margin-top: 4px; }
  canvas {
    display: block;
    border-radius: 14px;
    background: radial-gradient(circle at 50% 20%, #232334 0%, #14141c 100%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .65);
  }

  /* ---------- 参数控制面板 ---------- */
  .panel {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: 22px;
    padding: 14px 26px;
    background: rgba(30, 30, 44, .72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
    width: 900px;
  }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .label-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: .76rem;
    color: #90caf9;
    font-weight: 500;
  }
  .value { color: #ffffff; font-family: ui-monospace, Consolas, monospace; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 170px;
    height: 6px;
    border-radius: 3px;
    background: #33334d;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #00e5ff;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0, 229, 255, .8);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #00e5ff;
    cursor: pointer;
  }
  .btn {
    border: none;
    padding: 9px 20px;
    font-size: .82rem;
    font-weight: 600;
    border-radius: 9px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%);
    box-shadow: 0 3px 12px rgba(229, 57, 53, .35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(229, 57, 53, .5); }
  .btn:active { transform: translateY(0); }

  .hint { font-size: .74rem; color: #7a869a; }
</style>
</head>
<body>
  <header style="text-align:center">
    <h1>单摆物理模拟器</h1>
    <div class="sub">Week05 · 参数实时联动</div>
  </header>

  <canvas id="stage" width="900" height="480"></canvas>

  <div class="panel">
    <div class="group">
      <div class="label-row"><span>摆长 Length</span><span class="value" id="lenVal">200 px</span></div>
      <input type="range" id="lenSlider" min="100" max="350" step="1" value="200">
    </div>

    <div class="group">
      <div class="label-row"><span>重力 Gravity</span><span class="value" id="gravVal">9.8</span></div>
      <input type="range" id="gravSlider" min="1" max="25" step="0.1" value="9.8">
    </div>

    <div class="group">
      <div class="label-row"><span>空气阻尼 Damping</span><span class="value" id="dampVal">0.002</span></div>
      <input type="range" id="dampSlider" min="0" max="0.01" step="0.0005" value="0.002">
    </div>

    <button class="btn" id="resetBtn" onclick="resetAnimation()">重置摆动</button>
    <span class="hint">拖动滑块可实时改变物理参数</span>
  </div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  // ---------- 物理参数（SI 单位，像素仅用于渲染） ----------
  const PX_PER_M = 100;             // 100px = 1m
  const DAMP_SCALE = 200;           // 阻尼系数放大到肉眼可感的衰减速度
  const origin = { x: canvas.width / 2, y: 90 };

  const DEFAULTS = { lengthPx: 200, gravity: 9.8, damping: 0.002 };
  const START_ANGLE = Math.PI / 4;  // 初始摆角 45°

  let lengthPx = DEFAULTS.lengthPx;
  let gravity = DEFAULTS.gravity;
  let damping = DEFAULTS.damping;

  let theta = START_ANGLE;
  let omega = 0;

  // ---------- 物理积分：α = -(g/L)·sinθ - c·ω ----------
  function step(dt) {
    const L = lengthPx / PX_PER_M;
    const c = damping * DAMP_SCALE;
    const alpha = -(gravity / L) * Math.sin(theta) - c * omega;
    omega += alpha * dt;
    theta += omega * dt;
  }

  // ---------- 渲染 ----------
  function draw() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const bobX = origin.x + lengthPx * Math.sin(theta);
    const bobY = origin.y + lengthPx * Math.cos(theta);

    // 平衡位置虚线参考
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([4, 8]);
    ctx.moveTo(origin.x, origin.y);
    ctx.lineTo(origin.x, origin.y + lengthPx + 40);
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // 悬点
    ctx.save();
    ctx.beginPath();
    ctx.arc(origin.x, origin.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#90caf9';
    ctx.shadowColor = '#42a5f5';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.restore();

    // 摆线
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(origin.x, origin.y);
    ctx.lineTo(bobX, bobY);
    ctx.strokeStyle = 'rgba(255,255,255,.42)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // 摆球（带微弱发光）
    ctx.save();
    ctx.beginPath();
    ctx.arc(bobX, bobY, 18, 0, Math.PI * 2);
    ctx.fillStyle = '#00e5ff';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 26;
    ctx.fill();
    ctx.restore();

    // 高光
    ctx.beginPath();
    ctx.arc(bobX - 5, bobY - 5, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fill();
  }

  // ---------- 面板联动 ----------
  const lenSlider = document.getElementById('lenSlider');
  const gravSlider = document.getElementById('gravSlider');
  const dampSlider = document.getElementById('dampSlider');
  const lenVal = document.getElementById('lenVal');
  const gravVal = document.getElementById('gravVal');
  const dampVal = document.getElementById('dampVal');

  lenSlider.addEventListener('input', function (e) {
    lengthPx = parseFloat(e.target.value);
    lenVal.textContent = lengthPx + ' px';
  });

  gravSlider.addEventListener('input', function (e) {
    gravity = parseFloat(e.target.value);
    gravVal.textContent = gravity.toFixed(1);
  });

  dampSlider.addEventListener('input', function (e) {
    damping = parseFloat(e.target.value);
    dampVal.textContent = damping.toFixed(4);
  });

  // ---------- 重置：回到 45° 静止初始态 ----------
  function resetSimulationState() {
    theta = START_ANGLE;
    omega = 0;
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    step(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
